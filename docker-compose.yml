version: '3.9'

services:
  app:
    build: .

    ports:
      - '5000:5000'

    depends_on:
      - postgres
      - redis

    environment:
      PORT: 5000
      BASE_URL: http://localhost:5000

      DB_USER: postgres
      DB_HOST: postgres
      DB_NAME: url_shortener
      DB_PASSWORD: postgres
      DB_PORT: 5432

      JWT_SECRET: mysecretkey
      REDIS_URL: redis://redis:6379

    volumes:
      - .:/app
      - /app/node_modules

    command: npm run dev

  postgres:
    image: postgres:16

    restart: always

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: url_shortener

    ports:
      - '5432:5432'

    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:latest

    ports:
      - '6379:6379'

volumes:
  postgres_data:
